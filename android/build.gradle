allprojects {
    repositories {
        mavenCentral()
        google()
    }
}
buildscript {
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.2'
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }
    lintOptions {
        abortOnError false
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    api 'com.facebook.react:react-native:+'
    implementation files('libs/android-sdk.aar')
    api ('com.ibm.watson:speech-to-text:9.2.0') {
        exclude group: 'com.google.code.findbugs', module: 'annotations'
    }
}
